services:
  mongo:
    image: mongo:7
    container_name: coworking-mongo-auth
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: coworking
      MONGO_INITDB_ROOT_PASSWORD: coworking123
      MONGO_INITDB_DATABASE: coworking_auth_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_auth_data:/data/db

volumes:
  mongo_auth_data:
