services:
  db:
    image: postgres:16-alpine
    container_name: coworking-db
    environment:
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking123
      POSTGRES_DB: coworking_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
